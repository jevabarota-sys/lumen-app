name: iOS Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      create_signing_certificates:
        description: 'Create a new distribution certificate/profile if none is valid (stores it in lumen-certificates)'
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  deploy-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios
      
      - name: Install Fastlane
        run: |
          cd ios
          gem install fastlane
      
      - name: Create App Store Connect API Key
        run: |
          mkdir -p "${{ runner.temp }}/private_keys"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 --decode > "${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
      
      - name: Prepare and verify certificates repo access
        env:
          RAW_MATCH_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_USER: jevabarota-sys
        run: |
          export LC_ALL=C
          raw=$(printf '%s' "$RAW_MATCH_AUTH" | tr -d '[:space:]')
          case "$raw" in
            ghp_*|github_pat_*)
              echo "Secret is a plain GitHub token; encoding it for user '$MATCH_GIT_USER'."
              user="$MATCH_GIT_USER"
              token="$raw" ;;
            *)
              decoded=$(printf '%s' "$raw" | base64 --decode 2>/dev/null | tr -d '\r\n' || true)
              user="${decoded%%:*}"
              token="${decoded#*:}"
              if [ -z "$user" ] || [ -z "$token" ] || [ "$token" = "$decoded" ]; then
                echo "::error::MATCH_GIT_BASIC_AUTHORIZATION (length ${#raw}) is neither a GitHub token (ghp_...) nor base64 of 'username:token'. Easiest fix: set the secret to the token itself."
                exit 1
              fi ;;
          esac
          echo "::add-mask::$token"
          case "$token" in
            *PASTE_TOKEN_HERE*|*YOURTOKEN*)
              echo "::error::MATCH_GIT_BASIC_AUTHORIZATION contains placeholder text instead of a real token."
              exit 1 ;;
          esac
          auth=$(printf '%s' "$user:$token" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          echo "Credential OK for user '$user' (token length ${#token})."
          if ! git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/jevabarota-sys/lumen-certificates HEAD > /dev/null; then
            echo "::error::GitHub rejected the token for jevabarota-sys/lumen-certificates. Check it is not expired/revoked and has the 'repo' scope."
            exit 1
          fi
          echo "Certificates repo access OK."
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$auth" >> "$GITHUB_ENV"

      - name: Build and deploy to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          CREATE_SIGNING_CERTIFICATES: ${{ inputs.create_signing_certificates == true && 'true' || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cd ios
          fastlane beta
      
      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios/fastlane/report.xml
            ios/fastlane/*.log
